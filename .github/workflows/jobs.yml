name: job-bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: job-bot
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python job_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      - run: |
          git config user.name "job-bot"; git config user.email "bot@users.noreply.github.com"
          git add seen.json; git diff --cached --quiet || (git commit -m "update seen" && git push)
